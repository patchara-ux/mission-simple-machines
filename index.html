 es.onerror=()=>toast('กำลังเชื่อมต่อใหม่...')}
 else{BC=new BroadcastChannel('msm_'+code);const ld=()=>{T=JSON.parse(localStorage['msm_'+code]||'{}');draw()};BC.onmessage=ld;ld()}}
const S=()=>T.s||{ph:'lobby',qi:0,d:DUR},P=()=>Object.entries(T.p||{}).map(([id,v])=>({id,...v}));
const A=qi=>T.a?.['q'+qi]||{},R=(qi,t)=>T.r?.['q'+qi]?.['t'+t]||0;
function board(){const ps=P();return TN.map((n,i)=>({i,n,m:ps.filter(p=>p.tm==i),pts:Object.keys(T.r||{}).reduce((s,k)=>s+(T.r[k]['t'+i]||0),0)})).filter(x=>x.m.length).sort((a,b)=>b.pts-a.pts)}
function lbHTML(n){const b=board(),mx=Math.max(1,...b.map(x=>x.pts));return b.slice(0,n||8).map((x,r)=>`<div class=lb><b>${r+1}. ${x.n}</b><i style="background:${TC[x.i]};width:${Math.max(4,x.pts/mx*50)}%"></i><b>${x.pts}</b></div>`).join('')||'<p>ยังไม่มีคะแนน</p>'}
// ===== ตรรกะเกม (ครู) =====
function nextS(){const s=S();if(s.ph=='lobby')return put('s',{ph:'intro',qi:0,d:DUR});if(s.ph=='intro')return put('s',{ph:'q',qi:s.qi,d:DUR});const qi=s.qi+1;if(qi>=Q.length)return put('s',{ph:'end',qi:s.qi,d:DUR});put('s',{ph:qi%5?'q':'intro',qi,d:DUR})}
function reveal(){const s=S();if(s.ph!='q')return;const qi=s.qi,a=A(qi),ps=P();let kc=0;
 for(let t=0;t<8;t++){const m=ps.filter(p=>p.tm==t);if(!m.length)continue;let pts=0,ok=0;m.forEach(p=>{const x=a[p.id];if(x&&x.c==0){ok++;pts+=100+Math.max(0,Math.round(20*(1-x.t/(s.d*1000))))}});if(m.length>1&&ok==m.length)pts+=50;put(`r/q${qi}/t${t}`,pts);kc+=ok}
 put(`k/q${qi}`,{c:kc,t:ps.filter(p=>a[p.id]).length});put('s',{ph:'rev',qi,d:s.d})}
function resetRoom(){if(confirm('เริ่มเกมใหม่ในห้องเดิม? (ล้างคะแนนและคำตอบ แต่เก็บรายชื่อทีม)')){put('a',null);put('r',null);put('k',null);put('s',{ph:'lobby',qi:0,d:DUR})}}
// ===== หน้าจอ =====
function landing(){const r=par.get('r');if(r){app.innerHTML=`<div class=card><h1>🛠️ Mission Simple Machines</h1><p>เข้าร่วมห้อง <b>${esc(r)}</b></p><input id=nm placeholder="ชื่อเล่นของคุณ" maxlength=20 value="${esc(sessionStorage.nm||'')}"><button class="btn g" onclick="sJoin('${esc(r)}')">เข้าร่วม ▶</button></div>`;return}
 if(sessionStorage.room){ROLE='S';connect(sessionStorage.room);return}
 app.innerHTML=`<div class="card c"><h1>🛠️ Mission Simple Machines</h1><h2>ภารกิจช่างกลกู้เมือง</h2><p>เกมผจญภัยวิทยาศาสตร์ ม.2 เรื่องเครื่องกลอย่างง่าย</p>
 <button class="btn b" onclick="tSetup()">👩‍🏫 ฉันคือครู</button><hr style="margin:14px 0"><p>นักเรียน: กรอกรหัสห้อง</p><input id=cd placeholder="รหัสห้อง" maxlength=6 style="text-transform:uppercase;text-align:center"><button class="btn g" onclick="location='?r='+$('#cd').value.toUpperCase()+(FB?'&f='+encodeURIComponent(FB):'')">ไปต่อ ▶</button></div>`}
function tSetup(){app.innerHTML=`<div class=card><h2>ตั้งค่าห้อง (ครู)</h2><p>Firebase Realtime Database URL (ว่างไว้ = โหมดทดลอง ใช้ได้เฉพาะเบราว์เซอร์เครื่องเดียวกัน ไม่เชื่อมมือถือ)</p><input id=fb value="${esc(FB)}" placeholder="https://xxxx-default-rtdb.firebaseio.com">
 <button class="btn g" onclick="mk()">สร้างห้องใหม่ ▶</button>${localStorage.msm_room?`<button class="btn b" onclick="ROLE='T';FB=\`${esc(FB)}\`;connect(localStorage.msm_room)">กลับเข้าห้องเดิม (${esc(localStorage.msm_room)})</button>`:''}</div>`}
function mk(){FB=$('#fb').value.trim().replace(/\/$/,'');localStorage.msm_fb=FB;const c=Math.random().toString(36).slice(2,6).toUpperCase();localStorage.msm_room=c;ROLE='T';connect(c);put('s',{ph:'lobby',qi:0,d:DUR})}
function sJoin(r){const n=$('#nm').value.trim();if(!n)return toast('กรอกชื่อก่อนนะ');sessionStorage.nm=n;sessionStorage.room=r;ROLE='S';connect(r)}
function pick(t){const m=P().filter(p=>p.tm==t&&p.id!=pid).length;if(m>=4)return toast('ทีมนี้เต็มแล้ว');pid=sessionStorage.pid='p'+Math.random().toString(36).slice(2,8);put(`p/${pid}`,{n:sessionStorage.nm,tm:t})}
function ans(c){const s=S();if(s.ph!='q')return;put(`a/q${s.qi}/${pid}`,{c,t:Date.now()-qS})}
function optsHTML(qi,mode){const q=Q[qi],o=ord(qi),mine=A(qi)[pid]?.c,cn=[0,0,0,0];Object.values(A(qi)).forEach(x=>cn[x.c]++);
 return o.map((k,p)=>`<button class="opt ${mode=='rev'?(k==0?'ok':'no'):mine==k?'sel':''}" style="background:${OC[p]}" ${mode=='S'?`onclick="ans(${k})"`:''}>${SH[p]} ${q[1+k]}${mode=='rev'?` <span class=tag>${cn[k]} คน</span>`:''}${mode=='S'&&mine==k?' ✔':''}</button>`).join('')}
function qHead(s){const l=LV[Math.floor(s.qi/5)];return `<div class=row><span><span class=tag>${l[0]} ด่าน ${Math.floor(s.qi/5)+1}: ${l[1]}</span><span class=tag>ข้อ ${s.qi+1}/${Q.length}</span><span class=tag>${TY[Q[s.qi][6]]}</span></span>${s.ph=='q'?`<b class=big style="font-size:44px" id=tm>${s.d}</b>`:''}</div>${s.ph=='q'?'<div class=bar><i id=bar style="width:100%"></i></div>':''}`}
function render(){const s=S();
 if(ROLE=='T'){
  if(s.ph=='lobby'){const url=location.href.split('?')[0]+'?r='+CODE+(FB?'&f='+encodeURIComponent(FB):''),b=TN.map((n,i)=>`<div class=team style="background:${TC[i]}">${n}<br>${P().filter(p=>p.tm==i).map(p=>esc(p.n)).join(', ')||'<small>รอสมาชิก...</small>'}</div>`).join('');
   app.innerHTML=`<div class=card><div class=row><div><h1>🛠️ Mission Simple Machines</h1><p>สแกน QR หรือเปิด <b>${esc(location.href.split('?')[0])}</b> แล้วกรอกรหัส</p><div class=big>${CODE}</div>${FB?'':'<p style="color:#c00">⚠️ โหมดทดลอง: ใช้ได้เฉพาะแท็บในเครื่องนี้ (ยังไม่ได้ตั้งค่า Firebase)</p>'}</div><div id=qr></div></div></div>
   <div class=card><h2>👥 ทีมที่เข้าร่วม (${P().length}/32 คน)</h2><div class=grid>${b}</div><div class=c><button class="btn g" onclick="nextS()" ${P().length?'':'disabled'}>เริ่มภารกิจ ▶</button></div></div>`;
   if(window.QRCode)new QRCode($('#qr'),{text:url,width:200,height:200});else $('#qr').innerHTML=`<small>${esc(url)}</small>`}
  else if(s.ph=='intro'){const l=LV[s.qi/5];app.innerHTML=`<div class="card c"><div class=big>${l[0]}</div><h1>ด่านที่ ${s.qi/5+1}: ${l[1]}</h1><h2>ทักษะ: ${l[2]}</h2><p>ปรึกษากันในทีมก่อนตอบ ตอบถูกทั้งทีมได้โบนัส!</p><button class="btn g" onclick="nextS()">เริ่มด่าน ▶</button></div><div class=card>${lbHTML(5)}</div>`}
  else if(s.ph=='q')app.innerHTML=`<div class=card>${qHead(s)}<h2 style="margin:14px 0">${Q[s.qi][0]}</h2>${optsHTML(s.qi,'T0')}<div class=row><span class=tag style="font-size:22px">ตอบแล้ว <span id=cnt>0/${P().length}</span></span><button class="btn" onclick="reveal()">เฉลยเลย</button></div></div>`;
  else if(s.ph=='rev'){const q=Q[s.qi],b=board();app.innerHTML=`<div class=card>${qHead(s)}<h2 style="margin:14px 0">${q[0]}</h2>${optsHTML(s.qi,'rev')}<div style="background:#fff7cc;border:3px solid #1f2d4d;border-radius:14px;padding:12px;margin:8px 0"><p>💡 <b>เฉลย:</b> ${q[5]}</p></div>
   <div>${b.map(x=>`<span class=tag style="background:${TC[x.i]}">${x.n} +${R(s.qi,x.i)}</span>`).join('')}</div><div class=row><div style="flex:1;min-width:260px">${lbHTML(5)}</div><button class="btn g" onclick="nextS()">${s.qi+1>=Q.length?'ดูผลสรุป 🏆':'ต่อไป ▶'}</button></div></div>`}
  else end(true)}
 else{
  if(!T.s)return app.innerHTML=`<div class="card c"><h2>⏳ กำลังเชื่อมต่อห้อง ${esc(sessionStorage.room||'')}...</h2><p>ถ้านานเกินไป ตรวจสอบรหัสห้องและอินเทอร์เน็ต</p><button class=btn onclick="sessionStorage.clear();location='.'">ออก</button></div>`;
  if(!me)return app.innerHTML=`<div class=card><h2>เลือกทีมของคุณ</h2><div class=grid>${TN.map((n,i)=>{const c=P().filter(p=>p.tm==i).length;return `<button class="opt" style="background:${TC[i]}" onclick="pick(${i})" ${c>=4?'disabled':''}>${n} <span class=tag>${c}/4</span></button>`}).join('')}</div></div>`;
  const tm=me.tm,hd=`<div class=row style="color:#fff;background:${TC[tm]};border:3px solid #1f2d4d;border-radius:14px;padding:6px 12px"><b>${TN[tm]}</b><b>${esc(me.n)}</b></div>`;
  if(s.ph=='lobby'||s.ph=='intro'){const l=LV[Math.floor(s.qi/5)];app.innerHTML=`<div class="card c">${hd}<h2 style="margin-top:14px">${s.ph=='lobby'?'🕐 รอครูเริ่มภารกิจ...':l[0]+' ด่าน '+(s.qi/5+1)+': '+l[1]}</h2><p>เตรียมปรึกษากันในทีมนะ!</p></div>`}
  else if(s.ph=='q'){const m=A(s.qi)[pid]!==undefined;app.innerHTML=`<div class=card>${hd}${qHead(s)}<h2 style="font-size:22px;margin:10px 0">${Q[s.qi][0]}</h2>${optsHTML(s.qi,'S')}<p class=c>${m?'✅ ส่งคำตอบแล้ว (เปลี่ยนได้ก่อนหมดเวลา) — ปรึกษาทีมต่อได้!':'💬 ปรึกษาทีมก่อน แล้วกดตอบ'}</p></div>`}
  else if(s.ph=='rev'){const q=Q[s.qi],x=A(s.qi)[pid],ok=x&&x.c==0;app.innerHTML=`<div class=card>${hd}<div class=c><div class=big>${!x?'⏰':ok?'✅':'❌'}</div><h2>${!x?'ยังไม่ได้ตอบ':ok?'ถูกต้อง!':'ยังไม่ถูก ไม่เป็นไร!'}</h2></div><p style="margin:10px 0">คำตอบที่ถูก: <b>${q[1]}</b></p><div style="background:#fff7cc;border:3px solid #1f2d4d;border-radius:14px;padding:12px"><p>💡 ${q[5]}</p></div><p class=c style="margin-top:10px"><span class=tag>ทีมได้ +${R(s.qi,tm)} คะแนน</span><span class=tag>อันดับ ${board().findIndex(b=>b.i==tm)+1}</span></p></div>`}
  else end(false)}}
function end(t){const b=board(),lv=LV.map((l,i)=>{let c=0,n=0;for(let q=i*5;q<i*5+5;q++){const k=T.k?.['q'+q];if(k){c+=k.c;n+=k.t}}return `<div class=lb><b>${l[0]} ${l[2]}</b><i style="background:${n&&c/n<.6?'#ff7043':'#43c463'};width:${n?c/n*50:0}%"></i><b>${n?Math.round(c/n*100):0}%</b></div>`}).join('');
 const mine=!t&&me?`<h2>ทีมของคุณอันดับ ${b.findIndex(x=>x.i==me.tm)+1} 🎉</h2>`:'';
 app.innerHTML=`<div class="card c"><div class=big>🏆</div><h1>ภารกิจสำเร็จ! เมืองกลับมาใช้งานได้แล้ว</h1>${mine}</div><div class=card><h2>อันดับทีม</h2>${lbHTML(8)}</div>${t?`<div class=card><h2>📊 ความเข้าใจรายด่าน (ตอบถูกทั้งห้อง) — แท่งสีส้ม = ควรทบทวน</h2>${lv}<div class=c><button class=btn onclick="resetRoom()">เล่นใหม่</button></div></div>`:''}`}
function draw(){if(!ROLE||!CODE)return;const s=S(),pl=P().map(p=>p.id+p.tm+p.n).join();me=T.p?.[pid];
 if(s.ph=='q'&&lq!=CODE+s.qi){lq=CODE+s.qi;qS=Date.now()}
 const sig=ROLE+(me?'m':'n')+(T.s?1:0)+s.ph+s.qi+(s.ph=='lobby'||!me?pl:'')+(ROLE=='S'&&s.ph=='q'?A(s.qi)[pid]?.c:'')+(s.ph=='rev'||s.ph=='end'?JSON.stringify([T.r,T.k]):'');
 if(sig!=last){last=sig;render()}}
setInterval(()=>{const s=S();if(!ROLE||s.ph!='q')return;const left=Math.max(0,s.d-Math.floor((Date.now()-qS)/1000)),t=$('#tm'),b=$('#bar');if(t)t.textContent=left;if(b)b.style.width=left/s.d*100+'%';
 if(ROLE=='T'){const n=Object.keys(A(s.qi)).length,c=$('#cnt');if(c)c.textContent=n+'/'+P().length;if((left<=0||(n&&n>=P().length))&&!busy){busy=1;reveal();setTimeout(()=>busy=0,1500)}}},250);
landing();
</script></body></html>
