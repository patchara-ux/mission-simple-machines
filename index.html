 <p style="margin-top:8px"><b>เลือกทีมของคุณ</b></p><div class=grid>${TN.map((n,i)=>`<button class="opt tm ${TM===i?'sel':''}" style="background:${TC[i]}" onclick="selT(${i})">${n}</button>`).join('')}</div>
 <button class="btn g" onclick="start()">เริ่มภารกิจ ▶</button><button class="btn b" onclick="CLS=cl($('#cc').value||par.get('c'));board()">🏆 กระดานอันดับ</button>${FB?'':'<p style="color:#c00;font-size:15px">โหมดทดลอง: คะแนนเก็บในเครื่องนี้เท่านั้น (ยังไม่ได้ตั้งค่า Firebase)</p>'}</div>`}
function selT(i){TM=i;document.querySelectorAll('.tm').forEach((b,j)=>b.classList.toggle('sel',j==i))}
function start(){const n=$('#nm').value.trim();if(!n)return toast('กรอกชื่อก่อนนะ');if(TM==null)return toast('เลือกทีมก่อนนะ');CLS=cl($('#cc').value||par.get('c'));
 me={...me,id:me.id||'p'+Math.random().toString(36).slice(2,9),n,tm:TM};localStorage.msm_me=JSON.stringify(me);G={qi:0,pts:0,ok:0,lv:[0,0,0,0,0,0],wrong:[],ph:'intro'};show()}
// ===== เล่นเกม =====
function go(){G.ph='q';G.t0=Date.now();show();iv=setInterval(tick,250)}
function tick(){const left=Math.max(0,DUR-Math.floor((Date.now()-G.t0)/1000)),t=$('#tm'),b=$('#bar');if(t)t.textContent=left;if(b)b.style.width=left/DUR*100+'%';if(left<=0)pick(-1)}
function pick(k){if(G.ph!='q')return;clearInterval(iv);const t=Date.now()-G.t0,ok=k==0,pts=ok?100+Math.max(0,Math.round(20*(1-t/(DUR*1000)))):0;
 G.pts+=pts;if(ok){G.ok++;G.lv[Math.floor(G.qi/5)]++}else G.wrong.push(G.qi);G.last={k,ok,pts};G.ph='fb';show()}
function next(){G.qi++;if(G.qi>=Q.length){G.ph='end';return show()}if(G.qi%5)go();else{G.ph='intro';show()}}
function show(){clearInterval(iv);const q=Q[G.qi]||Q[0],L=Math.floor(G.qi/5),l=LV[Math.min(L,5)],o=ord(G.qi);
 const hd=`<div class=row><span><span class=tag>${l[0]} ด่าน ${L+1}: ${l[1]}</span><span class=tag>ข้อ ${G.qi+1}/${Q.length}</span><span class=tag>⭐ ${G.pts}</span></span>${G.ph=='q'?'<b id=tm style="font-size:40px">'+DUR+'</b>':''}</div>${G.ph=='q'?'<div class=bar><i id=bar style="width:100%"></i></div>':''}`;
 if(G.ph=='intro')app.innerHTML=`<div class="card c"><div class=big>${l[0]}</div><h1>ด่านที่ ${L+1}: ${l[1]}</h1><h2>ทักษะ: ${l[2]}</h2><p>อ่านโจทย์ให้ดี ตอบถูกได้คะแนน ความเร็วมีผลเพียงเล็กน้อย</p><button class="btn g" onclick="go()">เริ่มด่าน ▶</button></div>`;
 else if(G.ph=='q')app.innerHTML=`<div class=card>${hd}<h2 style="font-size:clamp(20px,4vw,34px);margin:12px 0">${q[0]}</h2>${o.map((k,p)=>`<button class=opt style="background:${OC[p]}" onclick="pick(${k})">${SH[p]} ${q[1+k]}</button>`).join('')}<p class=c style="font-size:15px">ประเภทโจทย์: ${TY[q[6]]}</p></div>`;
 else if(G.ph=='fb'){const x=G.last;app.innerHTML=`<div class=card>${hd}<div class=c><div class=big>${x.k<0?'⏰':x.ok?'✅':'❌'}</div><h2>${x.k<0?'หมดเวลา':x.ok?'ถูกต้อง! +'+x.pts:'ยังไม่ถูก ไม่เป็นไร!'}</h2></div>${o.map((k,p)=>`<button class="opt ${k==0?'ok':k==x.k?'sel':'no'}" style="background:${OC[p]}" disabled>${SH[p]} ${q[1+k]}</button>`).join('')}<div style="background:#fff7cc;border:3px solid #1f2d4d;border-radius:14px;padding:12px"><p>💡 <b>เฉลย:</b> ${q[5]}</p></div><div class=c><button class="btn g" onclick="next()">${G.qi+1>=Q.length?'ดูผลสรุป 🏆':'ต่อไป ▶'}</button></div></div>`}
 else end()}
function end(){const tot=Q.length*5,weak=G.lv.map((v,i)=>v<=2?LV[i][2]:null).filter(Boolean);
 app.innerHTML=`<div class="card c"><div class=big>🏆</div><h1>ภารกิจสำเร็จ! คะแนน ${G.pts}</h1><h2>ตอบถูก ${G.ok}/${Q.length} ข้อ</h2><p id=st>กำลังบันทึกคะแนน...</p></div>
 <div class=card><h2>📊 ความเข้าใจรายด่าน</h2>${LV.map((l,i)=>`<div class=lb><b>${l[0]} ${l[2]}</b><i style="background:${G.lv[i]<=2?'#ff7043':'#43c463'};width:${G.lv[i]*10}%"></i><b>${G.lv[i]}/5</b></div>`).join('')}<p>${weak.length?'ควรทบทวน: <b>'+weak.join(', ')+'</b>':'เยี่ยมมาก! เข้าใจครบทุกเรื่อง 🎉'}</p></div>
 ${G.wrong.length?`<div class=card><h2>ทบทวนข้อที่ยังไม่ถูก</h2>${G.wrong.map(i=>`<details style="margin:8px 0"><summary><b>ข้อ ${i+1}:</b> ${Q[i][0]}</summary><p>✔ ${Q[i][1]}</p><p>💡 ${Q[i][5]}</p></details>`).join('')}</div>`:''}
 <div class="card c"><button class="btn g" onclick="board()">🏆 ดูกระดานอันดับ</button><button class=btn onclick="start0()">เล่นอีกครั้ง</button></div>`;submit()}
function start0(){G={qi:0,pts:0,ok:0,lv:[0,0,0,0,0,0],wrong:[],ph:'intro'};show()}
async function submit(){const st=()=>$('#st'),b=me.b||{};if((b[CLS]||0)>=G.pts){st()&&(st().textContent='คะแนนครั้งนี้ไม่สูงกว่าคะแนนที่ดีที่สุดของคุณ ('+b[CLS]+') จึงไม่เปลี่ยนอันดับ');return}
 try{await putRec({n:me.n,tm:me.tm,s:G.pts,c:G.ok,lv:G.lv,at:Date.now()});me.b={...b,[CLS]:G.pts};localStorage.msm_me=JSON.stringify(me);st()&&(st().textContent='✅ บันทึกคะแนนแล้ว')}
 catch(e){st()&&(st().innerHTML='⚠️ บันทึกคะแนนไม่สำเร็จ <button class=btn style="font-size:16px;padding:6px 12px" onclick="submit()">ลองใหม่</button>')}}
// ===== กระดานอันดับ (รีเฟรชอัตโนมัติทุก 15 วินาที) =====
async function board(proj){clearInterval(iv);clearInterval(bv);const draw=async()=>{let o;try{o=await getLB()}catch(e){app.innerHTML=`<div class="card c"><h2>โหลดอันดับไม่สำเร็จ</h2><button class=btn onclick="board(${!!proj})">ลองใหม่</button>${proj?'':'<button class=btn onclick="landing()">กลับ</button>'}</div>`;return}
 const ps=Object.entries(o).map(([id,v])=>({id,...v})).filter(p=>p&&p.n).sort((a,b)=>b.s-a.s),tm=TN.map((n,i)=>({i,n,m:ps.filter(p=>p.tm==i)})).map(x=>({...x,s:x.m.reduce((a,p)=>a+p.s,0)})).filter(x=>x.m.length).sort((a,b)=>b.s-a.s),mx=Math.max(1,...tm.map(x=>x.s)),
 lvAvg=LV.map((l,i)=>{const v=ps.filter(p=>p.lv).map(p=>+p.lv[i]||0);return v.length?v.reduce((a,b)=>a+b,0)/v.length/5:0}),md=['🥇','🥈','🥉'];
 app.innerHTML=`<div class=card><div class=row><h2>🏆 กระดานอันดับ ห้อง ${esc(CLS)}</h2><span class=tag>ผู้เล่น ${ps.length} คน</span></div>
 <h2 style="font-size:24px;margin-top:10px">ทีม (รวมคะแนนสมาชิก)</h2>${tm.map((x,r)=>`<div class=lb><b>${md[r]||r+1+'.'} ${x.n} <small>(${x.m.length} คน)</small></b><i style="background:${TC[x.i]};width:${Math.max(4,x.s/mx*45)}%"></i><b>${x.s}</b></div>`).join('')||'<p>ยังไม่มีคะแนน เป็นคนแรกเลย!</p>'}
 <h2 style="font-size:24px;margin-top:10px">10 อันดับบุคคล</h2>${ps.slice(0,10).map((p,r)=>`<div class=lb style="${p.id==me.id?'background:#fff7cc;border-radius:10px;':''}"><b>${md[r]||r+1+'.'} ${esc(p.n)} <small>${TN[p.tm]||''}</small></b><b>${p.s}</b></div>`).join('')}
 <h2 style="font-size:24px;margin-top:10px">ความเข้าใจรายด่านของทั้งห้อง</h2>${LV.map((l,i)=>`<div class=lb><b>${l[0]} ${l[2]}</b><i style="background:${lvAvg[i]<.6?'#ff7043':'#43c463'};width:${lvAvg[i]*45}%"></i><b>${Math.round(lvAvg[i]*100)}%</b></div>`).join('')}
 ${proj?'':'<div class=c><button class="btn b" onclick="board()">🔄 รีเฟรช</button><button class=btn onclick="landing()">← กลับ</button></div>'}</div>`};
 await draw();bv=setInterval(draw,15000)}
par.get('b')?board(true):landing();
</script></body></html>
